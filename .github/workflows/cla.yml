name: CLA

# Asks first-time contributors to agree to docs/CLA.md on their pull request, and records it on the
# cla-signatures branch, one file per CLA version. It never checks out or runs the pull request's code.
# Weblate's pull requests are skipped: translators accept the agreement in Weblate itself.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >
      (github.event_name == 'pull_request_target' && github.event.pull_request.user.login != 'weblate') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.issue.user.login != 'weblate')
    runs-on: ubuntu-latest
    steps:
      - name: Check the agreement
        if: >
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read and agree to the DispHub CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/qlintenFX/DispHub/blob/main/docs/CLA.md
          branch: cla-signatures
          allowlist: qlintenFX,dependabot[bot],claude[bot]
          custom-pr-sign-comment: I have read and agree to the DispHub CLA
          custom-notsigned-prcomment: >
            Thanks for contributing to DispHub. Before it can be merged, please read the
            [contributor licence agreement](https://github.com/qlintenFX/DispHub/blob/main/docs/CLA.md) and agree to
            it by commenting exactly the sentence below. You only need to do this once.
          lock-pullrequest-aftermerge: false
