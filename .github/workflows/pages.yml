name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Pages is turned on in Settings > Pages (Source: GitHub Actions); until then there's nothing to publish to.
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      # Tell Bing and the other IndexNow search engines that the pages changed, so they're crawled within hours instead
      # of weeks (Bing's index also feeds DuckDuckGo, Copilot and ChatGPT search). The key file sits next to the pages.
      - name: Notify IndexNow
        continue-on-error: true
        env:
          KEY: e1b4c1d827b63237b9a906af76f3ae1a
        run: |
          grep -o '<loc>[^<]*' site/sitemap.xml | sed 's/<loc>//' | jq -R . | jq -s \
            --arg key "$KEY" '{host: "getdisphub.com", key: $key, keyLocation: "https://getdisphub.com/\($key).txt", urlList: .}' |
            curl -sS --fail-with-body -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' --data-binary @-
