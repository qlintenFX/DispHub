name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test --project tests/DispHub.Tests/DispHub.Tests.csproj -c Release
      - name: Build MSIX bundle
        shell: pwsh
        run: ./build/package-msix.ps1 -Configuration Release
      - uses: actions/upload-artifact@v7
        with:
          name: msix
          path: artifacts/*.msixbundle
          if-no-files-found: error
