<!doctype html>
<!--
  DispHub's own preview picture, the "test image": the logo's monitor with test patterns, and the wordmark.
  Rendered at twice the size of Assets/Previews/testcard-wide.jpg (960 x 600); see render.py next to it.
  The screen is the logo's own: its colour wave is a smooth gradient, where banding would show. Beside it: skin
  tones, primaries and secondaries, near-black steps (only just there; shadow boost and brightness bring them out),
  a grey step ramp and a smooth black-to-white ramp.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1200px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif;
    background:
      radial-gradient(1100px 820px at 4% -8%, rgba(23, 88, 220, 0.50), transparent 64%),
      radial-gradient(900px 700px at 104% 112%, rgba(232, 112, 40, 0.36), transparent 62%),
      linear-gradient(180deg, #0b1226 0%, #070a12 62%, #0a0a10 100%);
  }
  /* A fine grain, so the dark background doesn't band either. */
  body::after {
    content: ""; position: absolute; inset: 0; opacity: 0.32; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.09 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  }

  /* The monitor: the logo itself, at its own size, lit from behind in its own colours. */
  .glow {
    position: absolute; left: -120px; top: 40px; width: 1340px; height: 1060px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(30, 150, 245, 0.46), rgba(30, 150, 245, 0.16) 52%, transparent 100%);
    filter: blur(40px);
  }
  .glow.warm {
    left: 40px; top: 420px; width: 820px; height: 640px;
    background: radial-gradient(closest-side, rgba(250, 140, 40, 0.30), transparent 100%);
  }
  .monitor { position: absolute; left: 150px; top: 196px; width: 798px; height: 798px; }
  .monitor img { position: absolute; inset: 0; width: 798px; height: 798px; }

  .side { position: absolute; left: 1060px; top: 222px; width: 720px; }
  .eyebrow {
    font: 600 26px/1 "Segoe UI Variable Text", "Segoe UI", sans-serif; letter-spacing: 0.32em;
    color: #8fa6c8; text-transform: uppercase;
  }
  .wordmark {
    margin: 22px 0 0 -6px; font-weight: 600; font-size: 176px; line-height: 1; letter-spacing: -0.035em; color: #fff;
  }
  .wordmark span {
    background: linear-gradient(90deg, #148cf5 0%, #1ed2e6 30%, #8cdc50 55%, #f5c82d 78%, #fa781e 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .chips { margin-top: 58px; display: grid; grid-template-columns: repeat(6, 92px); gap: 20px; }
  .chips i { height: 92px; border-radius: 20px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
  .steps {
    margin-top: 20px; width: 652px; height: 58px; border-radius: 14px; overflow: hidden; display: flex;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10);
  }
  /* Near-black steps: the first melts into black, the rest are only just there. */
  .steps.shadows { margin-top: 34px; background: #000; padding: 0 0; }
  .steps i { flex: 1; }
  .ramp {
    margin-top: 18px; width: 652px; height: 20px; border-radius: 10px;
    background: linear-gradient(90deg, #000, #fff); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow warm"></div>
  <div class="monitor">
    <img src="../icon-shadow.png" alt="">
    <img src="../icon.png" alt="">
  </div>

  <div class="side">
    <div class="eyebrow">Colour test image</div>
    <div class="wordmark">Disp<span>Hub</span></div>
    <div class="chips">
      <!-- Skin tones, light to deep. -->
      <i style="background: #f3d5c0"></i><i style="background: #e6b594"></i><i style="background: #cf9670"></i>
      <i style="background: #b27551"></i><i style="background: #87573a"></i><i style="background: #573626"></i>
      <!-- Primaries and secondaries. -->
      <i style="background: #e0362e"></i><i style="background: #2fb44b"></i><i style="background: #2f6fe0"></i>
      <i style="background: #23c4d8"></i><i style="background: #d43ea4"></i><i style="background: #f2c12e"></i>
    </div>
    <div class="steps shadows">
      <i style="background: rgb(0, 0, 0)"></i><i style="background: rgb(2, 2, 2)"></i><i style="background: rgb(4, 4, 4)"></i>
      <i style="background: rgb(6, 6, 6)"></i><i style="background: rgb(8, 8, 8)"></i><i style="background: rgb(10, 10, 10)"></i>
      <i style="background: rgb(13, 13, 13)"></i><i style="background: rgb(16, 16, 16)"></i><i style="background: rgb(19, 19, 19)"></i>
      <i style="background: rgb(22, 22, 22)"></i><i style="background: rgb(26, 26, 26)"></i>
    </div>
    <div class="steps">
      <i style="background: #000"></i><i style="background: #1a1a1a"></i><i style="background: #333"></i>
      <i style="background: #4d4d4d"></i><i style="background: #666"></i><i style="background: #808080"></i>
      <i style="background: #999"></i><i style="background: #b3b3b3"></i><i style="background: #ccc"></i>
      <i style="background: #e6e6e6"></i><i style="background: #fff"></i>
    </div>
    <div class="ramp"></div>
  </div>
</body>
</html>
