# ═══════════════════════════════════════════════════════════
#  SonarCloud project configuration
#  https://sonarcloud.io/project/overview?id=qlintenFX_DispHub
# ═══════════════════════════════════════════════════════════

sonar.projectKey=qlintenFX_DispHub
sonar.organization=qlintenfx
sonar.host.url=https://sonarcloud.io

# ── Sources ──
sonar.sources=.
sonar.tests=DispHub.Tests
sonar.sourceEncoding=UTF-8

# ── Exclusions ──
# Exclude build artifacts, test results, and generated files from analysis
sonar.exclusions=\
  **/bin/**,\
  **/obj/**,\
  **/TestResults/**,\
  **/coveragereport/**,\
  **/Packaging/**,\
  **/*.Designer.cs

# ── Coverage ──
# Exclude UI code-behind from coverage metrics (difficult to unit test)
sonar.coverage.exclusions=\
  **/*.xaml.cs

# ── Duplication ──
# Exclude auto-generated and boilerplate files from duplication detection
sonar.cpd.exclusions=\
  **/*.Designer.cs,\
  **/Properties/AssemblyInfo.cs
